name: Priyo Azan CI & Auto-Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.1). Leave blank to auto-tag v1.0.<run_number>.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Restore consistent debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Resolve release version metadata
        id: version_meta
        shell: bash
        run: |
          TAG_NAME=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.release_tag }}" ]]; then
              TAG_NAME="${{ inputs.release_tag }}"
            else
              TAG_NAME="v1.0.${{ github.run_number }}"
            fi
          fi

          CLEAN_VERSION="${TAG_NAME#v}"
          [ -z "$CLEAN_VERSION" ] && CLEAN_VERSION="1.0"
          VERSION_CODE="${{ github.run_number }}0"

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK (Consistent Keystore for Direct Updates)
        run: gradle :app:assembleDebug --no-daemon --stacktrace -PappVersionName="${{ steps.version_meta.outputs.version_name }}" -PappVersionCode="${{ steps.version_meta.outputs.version_code }}"

      - name: Build Release APK (When Signing Keystore Secret is Present)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          gradle :app:assembleRelease --no-daemon --stacktrace -PappVersionName="${{ steps.version_meta.outputs.version_name }}" -PappVersionCode="${{ steps.version_meta.outputs.version_code }}"

      - name: Prepare Release Artifacts & Update Manifest
        id: release_meta
        shell: bash
        run: |
          TAG_NAME="${{ steps.version_meta.outputs.tag }}"
          CLEAN_VERSION="${{ steps.version_meta.outputs.version_name }}"
          VERSION_CODE="${{ steps.version_meta.outputs.version_code }}"

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          else
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi

          mkdir -p release-dist
          cp "$APK_SRC" release-dist/priyo-azan.apk
          SHA256=$(sha256sum release-dist/priyo-azan.apk | awk '{print $1}')

          cat > release-dist/update-manifest.json <<EOF
          {
            "version": "${CLEAN_VERSION}",
            "versionCode": ${VERSION_CODE},
            "platform": "android",
            "releaseNotes": "Priyo Azan ${TAG_NAME:-latest} automated release build.",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/priyo-azan.apk",
            "minimumSupportedVersion": "1.0",
            "sha256": "${SHA256}"
          }
          EOF

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK & Manifest
        if: steps.release_meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "Priyo Azan ${{ steps.release_meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            release-dist/priyo-azan.apk
            release-dist/update-manifest.json
