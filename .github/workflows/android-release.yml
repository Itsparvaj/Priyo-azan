name: Android CI & Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
      - name: Build Release AAB (Unsigned CI Verification)
        run: ./gradlew :app:bundleRelease
      - name: Compute APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
